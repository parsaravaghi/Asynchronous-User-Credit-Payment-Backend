services:
  postgress:
    image: postgres:18-alpine
    volumes:
     - type: tmpfs
       target: /dev/shm
       tmpfs:
         size: 134217728 # 128*2^20 bytes = 128Mb
    ports:
      - 5432:5432
    env_file:
      - .env

  reabbitmq: 
    image: rabbitmq:4-management-alpine
    volumes:
      - rabbitmqData:/var/lib/rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    env_file:
      - .env

volumes:
  rabbitmqData: 
    driver: local
